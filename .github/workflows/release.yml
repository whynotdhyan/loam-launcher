name: Release LOAM Setup

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        type: string

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Desktop Application (NSIS Installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LOAM ${{ github.ref_name }}'
          releaseBody: |
            ## LOAM Launcher ${{ github.ref_name }}
            *Your worlds, ready.*
            
            ### What's New
            See the commit history and release notes for complete details.
            
            ### Windows Setup
            - Download `LOAM Setup.exe` below.
            - Verify SHA-256 checksum with `Get-FileHash -Algorithm SHA256 "LOAM Setup.exe"`
          releaseDraft: true
          prerelease: false

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding utf8
            Write-Host "Generated SHA256 for $($_.Name): $hash"
          }
