name: Bug Report
description: Report a crash, install failure, import problem, or launcher bug
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report! If possible, please use the **Support & Feedback (`?`)** screen in LOAM Launcher to generate a pre-formatted, redacted diagnostics bundle.
  - type: input
    id: report-id
    attributes:
      label: LOAM Report ID
      description: If generated from LOAM Support & Feedback (e.g., LOAM-7K3Q-92)
      placeholder: "LOAM-XXXX-XX"
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Problem Type
      options:
        - Crash on launch
        - Install failed
        - Import failed
        - Login / Microsoft Account problem
        - Visual glitch
        - Performance / Memory
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Specifications
      description: LOAM version, Windows build, Java runtime, and Total RAM
      placeholder: "LOAM 1.0.0 · Windows 11 x64 (Build 26100) · 16 GB RAM"
    validations:
      required: true
  - type: input
    id: game-details
    attributes:
      label: Game & Loader Information
      description: Minecraft version, Mod loader, and allocated memory
      placeholder: "Minecraft 26.3 · Fabric 0.16.9 · 4096 MB"
    validations:
      required: true
  - type: dropdown
    id: account-type
    attributes:
      label: Account Type Used
      options:
        - Microsoft Account
        - Offline Profile
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear and concise description of the bug or error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open LOAM Launcher
        2. Click 'Install +' and select 26.3
        3. Click Play
        4. See error exit code ...
    validations:
      required: true
  - type: textarea
    id: logs-diagnostics
    attributes:
      label: Diagnostics & Redacted Logs
      description: Paste the redacted Markdown report generated by LOAM or attach the redacted diagnostics zip.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation & Privacy
      options:
        - label: I confirm this report does not contain any passwords, tokens, or unredacted personal identifiers.
          required: true
